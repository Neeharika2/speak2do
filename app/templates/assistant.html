<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #14213d; }
    header { background: #14213d; color: #fff; padding: 16px 24px; font-weight: 600; font-size: 1.1rem; }
    main { max-width: 980px; margin: 24px auto; padding: 0 16px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    h2 { font-size: 0.95rem; margin: 18px 0 8px; color: #5b6472; text-transform: uppercase; letter-spacing: 0.04em; }
    #start-button { width: 100%; padding: 26px; font-size: 1.3rem; font-weight: 700; border: 0; border-radius: 14px; background: #1f6feb; color: #fff; cursor: pointer; touch-action: manipulation; user-select: none; }
    #start-button.active { background: #d13438; }
    #status { font-weight: 600; margin: 12px 0 0; min-height: 1.4em; }
    #status[data-state="error"] { color: #9b1c1c; }
    #status[data-state="done"] { color: #166534; }
    #status[data-state="awaiting"] { color: #b91c1c; }
    .box { background: #f0f3f8; border-radius: 8px; padding: 10px 12px; min-height: 2.4em; white-space: pre-wrap; }
    #transcript { font-size: 1.15rem; }
    .lang-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .lang-row label { font-weight: 600; color: #5b6472; }
    #language { flex: 1; font-size: 1.05rem; padding: 8px; border: 1px solid #b9c0cc; border-radius: 8px; background: #fff; }
    input[type="text"] { width: 100%; box-sizing: border-box; font-size: 1.05rem; padding: 10px; border: 1px solid #b9c0cc; border-radius: 8px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #14213d; color: #fff; cursor: pointer; }
    #live-wrap { background: #e8ecf3; border-radius: 8px; min-height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #live { max-width: 100%; height: auto; display: block; }
    #steps { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.95rem; color: #334155; }
    #steps li { padding: 4px 0; border-bottom: 1px solid #eef2f7; }
    audio { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <header>Voice Assistant — Mock Scholarship Portal</header>
  <main>
    <section class="card">
      <h1>Talk to the assistant</h1>
      <button id="start-button" type="button">▶ Start</button>
      <div class="lang-row">
        <label for="language">Language</label>
        <select id="language">
          {% for lang in languages %}
          <option value="{{ lang.code }}" {% if lang.code == default_language %}selected{% endif %}>{{ lang.name }}{% if lang.name != lang.english_name %} — {{ lang.english_name }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <p id="status" data-state="idle">Press Start. The assistant will ask you for each detail — just answer by voice.</p>

      <h2>Assistant</h2>
      <div id="reply-text" class="box">—</div>
      <audio id="reply-audio" controls></audio>

      <h2>You said</h2>
      <div id="transcript" class="box">—</div>

      <h2>Your details</h2>
      <div id="updated" class="box">—</div>

      <h2>Or type your answer (fallback)</h2>
      <input id="text-fallback" type="text" placeholder="Type an answer when the mic is not available">
      <div class="row"><button id="text-send" type="button">Send</button></div>
    </section>

    <section class="card">
      <h1>Live view</h1>
      <div id="live-wrap"><img id="live" alt="Agent browser view"></div>
      <h2>Agent steps</h2>
      <ol id="steps"></ol>
    </section>
  </main>

  <script>
    (() => {
      const startButton = document.getElementById("start-button");
      const statusEl = document.getElementById("status");
      const transcriptEl = document.getElementById("transcript");
      const replyEl = document.getElementById("reply-text");
      const updatedEl = document.getElementById("updated");
      const liveImg = document.getElementById("live");
      const stepsEl = document.getElementById("steps");
      const audioEl = document.getElementById("reply-audio");
      const textInput = document.getElementById("text-fallback");
      const textSend = document.getElementById("text-send");
      const languageSelect = document.getElementById("language");
      const LANGUAGE_KEY = "voiceAssistant.language";
      try {
        const saved = localStorage.getItem(LANGUAGE_KEY);
        if (saved && [...languageSelect.options].some((o) => o.value === saved)) languageSelect.value = saved;
      } catch (err) {
        /* storage unavailable: keep the server default */
      }
      languageSelect.addEventListener("change", () => {
        try {
          localStorage.setItem(LANGUAGE_KEY, languageSelect.value);
        } catch (err) {
          /* ignore */
        }
      });

      const FIELD_LABELS = {{ field_labels | tojson }};  // language code -> field key -> spoken name
      const SAMPLE_RATE = 48000;     // the STT stream is opened at 48 kHz (server side)
      const FRAME_SAMPLES = 512;     // Gnani needs exactly 512-sample PCM16 frames
      const ECHO_TAIL_S = 0.35;      // keep the mic muted briefly after the agent stops talking
      const ACTIVE = ["queued", "transcribing", "running", "speaking", "awaiting"];

      let mediaStream = null;
      let audioContext = null;       // one context: mic capture + agent speech playback
      let sourceNode = null;
      let processorNode = null;
      let muteNode = null;
      let conversationOn = false;
      let starting = false;
      let currentSession = null;
      let pollTimer = null;
      let sessionState = null;
      let lastSpeechId = 0;
      let liveTranscript = "";
      let voiceWs = null;
      let wsReady = false;
      let wsLeftover = new Int16Array(0);
      let wsAudioForSession = 0;
      let speakingUntil = 0;         // audioContext time when queued agent speech ends
      const speechSlots = { speech: { id: 0, nextTime: 0 }, reply: { id: 0, nextTime: 0 } };

      const STATUS_TEXT = {
        queued: "Starting…",
        transcribing: "Listening…",
        running: "Working — watch the live view",
        speaking: "Assistant is speaking…",
        awaiting: "Your turn — speak your answer",
        done: "Done",
        error: "Something went wrong",
      };

      function setStatus(text, state) {
        statusEl.textContent = text;
        statusEl.dataset.state = state;
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
      }

      function agentSpeaking() {
        const queued = audioContext && audioContext.currentTime < speakingUntil + ECHO_TAIL_S;
        return Boolean(queued || !audioEl.paused);
      }

      function wsOpen() {
        return wsReady && voiceWs && voiceWs.readyState === WebSocket.OPEN;
      }

      // ------------------------------------------------------------------ mic (hands-free)

      async function ensureAudio() {
        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
          });
        }
        if (!audioContext) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          try {
            audioContext = new Ctx({ sampleRate: SAMPLE_RATE });
          } catch (err) {
            audioContext = new Ctx();
          }
        }
        if (audioContext.state === "suspended") await audioContext.resume();
      }

      function toPcm16(input) {
        const out = new Int16Array(input.length);
        for (let i = 0; i < input.length; i += 1) {
          const sample = Math.max(-1, Math.min(1, input[i]));
          out[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        return out;
      }

      function sendFrames(int16) {
        const merged = new Int16Array(wsLeftover.length + int16.length);
        merged.set(wsLeftover, 0);
        merged.set(int16, wsLeftover.length);
        let offset = 0;
        while (merged.length - offset >= FRAME_SAMPLES) {
          voiceWs.send(merged.slice(offset, offset + FRAME_SAMPLES).buffer);
          offset += FRAME_SAMPLES;
        }
        wsLeftover = merged.slice(offset);
      }

      function startMic() {
        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        processorNode = audioContext.createScriptProcessor(4096, 1, 1);
        processorNode.onaudioprocess = (event) => {
          if (!conversationOn || !wsOpen()) return;
          const input = event.inputBuffer.getChannelData(0);
          // Half-duplex: while the assistant talks, send silence so it never hears itself.
          sendFrames(agentSpeaking() ? new Int16Array(input.length) : toPcm16(input));
        };
        muteNode = audioContext.createGain();
        muteNode.gain.value = 0;
        sourceNode.connect(processorNode);
        processorNode.connect(muteNode);
        muteNode.connect(audioContext.destination);
        wsLeftover = new Int16Array(0);
        voiceWs.send(JSON.stringify({ type: "start" }));
      }

      function stopMic() {
        try {
          if (processorNode) processorNode.disconnect();
          if (sourceNode) sourceNode.disconnect();
          if (muteNode) muteNode.disconnect();
        } catch (err) {
          /* already disconnected */
        }
        processorNode = sourceNode = muteNode = null;
        if (wsOpen()) voiceWs.send(JSON.stringify({ type: "stop" }));
      }

      async function startConversation() {
        if (conversationOn || starting) return;
        if (!wsOpen()) {
          setStatus("Voice connection not ready yet — try again in a moment, or type below.", "error");
          return;
        }
        starting = true;
        try {
          await ensureAudio();
        } catch (err) {
          starting = false;
          setStatus("Microphone unavailable — allow mic access, or type your answers below.", "error");
          return;
        }
        starting = false;
        conversationOn = true;
        languageSelect.disabled = true;
        startButton.classList.add("active");
        startButton.textContent = "■ Stop";
        transcriptEl.textContent = "—";
        // begin first: the server switches speech recognition to this language before audio flows
        voiceWs.send(JSON.stringify({ type: "begin", language: languageSelect.value }));
        startMic();
        setStatus(STATUS_TEXT.queued, "queued");
      }

      function endConversation({ notifyServer }) {
        if (!conversationOn) return;
        conversationOn = false;
        languageSelect.disabled = false;
        startButton.classList.remove("active");
        startButton.textContent = "▶ Start";
        if (notifyServer && wsOpen()) voiceWs.send(JSON.stringify({ type: "end" }));
        stopMic();
      }

      // ------------------------------------------------------------------ text fallback

      function inputEndpoint() {
        if (sessionState && sessionState.awaiting_input) return "/api/voice/answer";
        if (sessionState && ACTIVE.includes(sessionState.status)) return "/api/voice/interrupt";
        return "/api/voice/command";
      }

      async function sendText() {
        const text = textInput.value.trim();
        if (!text) return;
        const endpoint = inputEndpoint();
        liveTranscript = text;
        transcriptEl.textContent = text;
        const form = new FormData();
        form.append("text", text);
        form.append("language", languageSelect.value);
        try {
          const response = await fetch(endpoint, { method: "POST", body: form });
          if (!response.ok) {
            const detail = await response.json().catch(() => ({}));
            setStatus(detail.detail || "Request failed.", "error");
            return;
          }
          const data = await response.json();
          if (endpoint === "/api/voice/command") startPolling(data.session_id);
          textInput.value = "";
        } catch (err) {
          setStatus("Request failed: " + err.message, "error");
        }
      }

      // ------------------------------------------------------------------ session polling

      function startPolling(sessionId) {
        currentSession = sessionId;
        sessionState = null;
        lastSpeechId = 0;
        wsAudioForSession = 0;
        replyEl.textContent = "—";
        updatedEl.textContent = "—";
        stepsEl.innerHTML = "";
        if (pollTimer) clearInterval(pollTimer);
        poll();
        pollTimer = setInterval(poll, 800);
      }

      function showStatus(data) {
        if (data.status === "awaiting" && agentSpeaking()) {
          setStatus(STATUS_TEXT.speaking, "awaiting");
        } else if (data.status === "awaiting") {
          setStatus(STATUS_TEXT.awaiting, "awaiting");
        } else {
          setStatus(STATUS_TEXT[data.status] || data.status, data.status);
        }
      }

      async function poll() {
        if (!currentSession) return;
        try {
          const response = await fetch(`/api/voice/session/${currentSession}`);
          if (!response.ok) return;
          const data = await response.json();
          sessionState = data;
          showStatus(data);
          transcriptEl.textContent = liveTranscript || data.transcript || "—";
          const showReply = data.status === "done" || data.status === "speaking" || data.status === "error";
          replyEl.textContent = showReply
            ? data.reply_text || data.error || "—"
            : data.prompt_text || data.reply_text || "—";
          if (data.speech_id && data.speech_id !== lastSpeechId) {
            lastSpeechId = data.speech_id;
            if (!wsReady || wsAudioForSession === 0) {
              audioEl.src = `/api/voice/session/${currentSession}/speech?ts=${Date.now()}`;
              audioEl.play().catch(() => {});
            }
          }
          const entries = Object.entries(data.updated_fields || {});
          updatedEl.textContent = entries.length
            ? entries.map(([field, value]) => `${(FIELD_LABELS[data.language] || {})[field] || field}: ${value}`).join("\n")
            : "—";
          stepsEl.innerHTML = data.steps.map((step) => `<li>${escapeHtml(step)}</li>`).join("");
          if (["running", "awaiting", "speaking", "done"].includes(data.status)) {
            liveImg.src = `/api/voice/session/${currentSession}/screenshot?ts=${Date.now()}`;
          }
          if (data.status === "done" || data.status === "error") {
            clearInterval(pollTimer);
            pollTimer = null;
            endConversation({ notifyServer: false });
            if (data.status === "done" && (!wsReady || wsAudioForSession === 0)) {
              audioEl.src = `/api/voice/session/${currentSession}/audio?ts=${Date.now()}`;
              audioEl.play().catch(() => {});
            }
          }
        } catch (err) {
          /* transient; keep polling */
        }
      }

      // ------------------------------------------------------------------ voice socket

      function connectVoiceWs() {
        try {
          const scheme = location.protocol === "https:" ? "wss" : "ws";
          voiceWs = new WebSocket(`${scheme}://${location.host}/ws/voice`);
        } catch (err) {
          setTimeout(connectVoiceWs, 2000);
          return;
        }
        voiceWs.binaryType = "arraybuffer";
        voiceWs.onopen = () => {
          wsReady = true;
          window.__wsReady = true;
          if (conversationOn) {
            // reconnected mid-conversation: resume streaming and re-bind the session
            wsLeftover = new Int16Array(0);
            voiceWs.send(JSON.stringify({ type: "start" }));
            if (sessionState && ACTIVE.includes(sessionState.status)) {
              voiceWs.send(JSON.stringify({ type: "begin", language: languageSelect.value }));
            }
          }
        };
        voiceWs.onclose = () => {
          wsReady = false;
          window.__wsReady = false;
          setTimeout(connectVoiceWs, 2000);
        };
        voiceWs.onerror = () => {
          wsReady = false;
        };
        voiceWs.onmessage = (event) => {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch (err) {
            return;
          }
          if (data.type === "transcript") {
            liveTranscript = data.text || "";
            transcriptEl.textContent = liveTranscript || "—";
          } else if (data.type === "session") {
            if (data.session_id && data.session_id !== currentSession) startPolling(data.session_id);
          } else if (data.type === "audio") {
            playWsChunk(data);
          } else if (data.type === "audio_fallback") {
            playFallbackAudio(data.kind);
          } else if (data.type === "error") {
            setStatus("Voice stream error: " + (data.message || ""), "error");
          }
        };
      }

      function playWsChunk(message) {
        window.__wsAudioCount = (window.__wsAudioCount || 0) + 1;
        if (!audioContext) return; // no Start press (text-only): poll() plays the saved file instead
        wsAudioForSession += 1;
        const slot = speechSlots[message.kind] || speechSlots.speech;
        if (slot.id !== message.id) {
          slot.id = message.id;
          slot.nextTime = 0;
        }
        const binary = atob(message.data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        const samples = new Int16Array(bytes.buffer);
        const floats = new Float32Array(samples.length);
        for (let i = 0; i < samples.length; i += 1) floats[i] = samples[i] / 32768;
        const buffer = audioContext.createBuffer(1, floats.length, message.sample_rate || SAMPLE_RATE);
        buffer.copyToChannel(floats, 0);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        const startAt = Math.max(audioContext.currentTime + 0.02, slot.nextTime);
        source.start(startAt);
        slot.nextTime = startAt + buffer.duration;
        speakingUntil = Math.max(speakingUntil, slot.nextTime);
      }

      function playFallbackAudio(kind) {
        if (!currentSession) return;
        const endpoint = kind === "reply" ? "audio" : "speech";
        audioEl.src = `/api/voice/session/${currentSession}/${endpoint}?ts=${Date.now()}`;
        audioEl.play().catch(() => {});
      }

      connectVoiceWs();

      startButton.addEventListener("click", () => {
        if (conversationOn) endConversation({ notifyServer: true });
        else startConversation();
      });
      textSend.addEventListener("click", sendText);
      textInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendText();
      });
    })();
  </script>
</body>
</html>
